# The repos the queue runner serves. Each gets its own Claude job at once, as the usage gate allows
# (#50); when it has room for only one more, this order breaks a tie.
# State and logs live outside every served repo.
state_dir = "~/.queue-runner/state"
log_dir = "~/.queue-runner/logs"
runs_dir = "~/.queue-runner/runs"            # each Sol review's brief, inputs, reply and comment
checkouts_dir = "~/.queue-runner/checkouts"  # Sol's detached checkout of a PR's head
deps_dir = "~/.queue-runner/deps"            # node_modules per lockfile, linked into that checkout
poll_seconds = 300   # continuous mode: the pause after a pass that started nothing
# The runner's cutover (issue 3): a blocking review posted before this date by the old loop (or by
# Sol from a T3 child) counts as the runner's own for fix rounds. One posted after it is left to
# the session that ran it.
adopt_reviews_before = 2026-11-10

# Claude jobs run as T3 threads on this provider instance and model, at this effort (ticket 39;
# Stefan, 2026-11-15: "keep it at high by default", until his Claude Max plan ends; 2026-11-16:
# "Opus 5.5 medium as worker"). T3's CLI has
# no effort flag: a thread started with --model gets the model's default (medium for Opus 5.5).
# So a repo's jobs start on its T3 project's default model instead, when that default is this
# model at this effort (T3 Settings, the project, New threads, Model), and with --model, at
# medium, when it isn't; the runner says which at start, and each end record has the effort the
# run used, read back from Claude Code's transcript (docs/t3.md).
[claude]
provider = "claudeAgent"
model = "claude-opus-5-5"
effort = "medium"

# Sol reviews run through codex-sol.sh at effort high (a T3 thread can't be given an effort).
[sol]
bash = "C:/Program Files/Git/bin/bash.exe"
# Who reviews every PR (issue #76): "claude" (an Opus thread in T3 at [claude]'s model and effort,
# through the usage gate) or "chatgpt" (Sol, the default; Opus steps in only while Sol is out of
# usage). Stefan, 2026-11-16: "Claude for now, until I say so, a full override"; later that day,
# with ChatGPT's usage back: "turn on 6.1 Sol high now".
[review]
provider = "chatgpt"
# An Opus review starts on this T3 provider instance, launched with no MCP tools, so it gets what a
# Sol review gets (docs/reviews.md, A review has no outside tools; set up 2026-11-17). Unset, it's
# claudeReviewer; empty or [claude]'s provider is an error: a review never gets the build's tools.
claude_provider = "claudeReviewer"

# First in this order (Stefan, 2026-11-15: "prioritize game backdrop full stop", its first
# run under the dashboard). Stefan merges its PRs himself (2026-11-15: "no auto merge, just
# leave it up to me"): a desktop app nobody runs before a merge. It has no live steps: merged
# is live.
[[repos]]
name = "game-backdrop"
github = "stefan1575/game-backdrop"
path = "~/Code/Personal/game-backdrop"
base = "main"
merge = "stefan"

[[repos]]
name = "leads-dashboard"
github = "RoyalBullyAgency-RBA/leads-dashboard"
path = "~/Code/Work/leads-dashboard"
base = "main"
review_table = true   # the runner's own output: each review adds a row to the PR body's `## Review` table
# Live steps after merges (ticket 11): one Claude thread per batch follows this doc (the Lovable
# connector's deploy_project, query_database per migration, npm run check:live-schema).
live_doc = "docs/agents/lovable-cloud.md"
# The runner merges its clean PRs and runs their live steps (Stefan, 2026-11-18: "fully
# autonomous in this repo as well"; it was `merge = "stefan"` from ticket 17, 2026-11-10).
merge = "runner"

# The runner's own repo (ticket 14, Stefan 2026-11-10): served like any other, and it merges its
# own PRs. After main moves, the runner updates its checkout and restarts on the new code.
[[repos]]
name = "queue-runner"
github = "stefan1575/queue-runner"
path = "~/Code/Personal/queue-runner"
base = "main"

# A repo whose tickets are local markdown (`.scratch/<feature>/issues/NN-<slug>.md`, ticket 12)
# would say `issues = "local"`; the runner only names its next ticket in `--once --dry-run` and
# builds none (no served repo needs it: Stefan, 2026-11-10).
