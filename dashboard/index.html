  const read = e && ahead && "read" in e ? e.read === true : !!a.read;
  const until = e && ahead && "snooze_until" in e ? e.snooze_until : a.snoozed_until;
  return { read, until };
}
const isRead = (a) => mark(a).read;
function snoozedUntil(a) { const t = mark(a).until; return t && ms(t) > Date.now() ? t : null; }
const asking = new Set();   // requests on their way, so a redraw meanwhile doesn't send one again
function askMark(id, change) {
  const body = { ask: id, ...change }, key = JSON.stringify(body);
  if (asking.has(key)) return;
  asking.add(key);
  // Shown at once; the next read of control.json replaces this.
  ctl = { ...ctl, written_at: new Date().toISOString(), asks: { ...(ctl.asks || {}), [id]: { ...((ctl.asks || {})[id] || {}), ...change } } };
  send([body]).finally(() => asking.delete(key));
}
const setRead = (a, yes) => askMark(a.id, { read: yes });
// The envelope: a read ask is marked unread, an unread one read. The open one, marked unread,
// stays unread until you open another (ui.hold), or opening it would read it again at once.
function toggleRead(a) {
  const yes = !isRead(a);
  setRead(a, yes);
  if (a.id === ui.ask) ui.hold = yes ? null : a.id;
}
const setSnooze = (id, until) => askMark(id, { snooze_until: until || null });
function snoozeChoices() {
  const now = new Date(), later = new Date(now.getTime() + 3 * 3600e3);
  const tomorrow = new Date(now); tomorrow.setDate(now.getDate() + 1); tomorrow.setHours(9, 0, 0, 0);
  const week = new Date(now); week.setDate(now.getDate() + ((8 - now.getDay()) % 7 || 7)); week.setHours(9, 0, 0, 0);
  if (week.toDateString() === tomorrow.toDateString()) week.setDate(week.getDate() + 7);
  return [["For 3 hours", later], ["Until tomorrow morning", tomorrow], ["Until next week", week]];
}

function inboxLists() {
  const mine = scoped(snap.asks || []);
  return { all: snap.asks || [], open: mine.filter((a) => !snoozedUntil(a)), snoozed: mine.filter((a) => snoozedUntil(a)), answered: scoped(snap.answered || []) };
}
function inboxOrder() { const l = inboxLists(); return [...l.open, ...l.snoozed, ...l.answered]; }
function pickAsk() {
  const every = inboxOrder(), { open } = inboxLists();
  if (!every.some((a) => a.id === ui.ask)) ui.ask = open.length ? open[0].id : null;
  return every.find((a) => a.id === ui.ask) || null;
}
// Every job a lane runs now: the Claude lane runs one per repository (#50; `job` is the newest).
const laneJobs = (l) => l.jobs || (l.job ? [l.job] : []);
// The lane whose job is on this ask's work, if one is, with that job as its `job`.
function laneOn(a) {
  for (const l of snap.lanes || []) {
    const j = l.state === "working" && laneJobs(l).find((j) => j.repo === a.repo && (j.ref === a.ref || (a.pr && j.pr === a.pr)));
    if (j) return { ...l, job: j };
  }
  return null;
}
function kindTag(a) {
  if (a.answered) return laneOn(a) ? `<span class="kind-tag run"><i class="pulse"></i>Working</span>` : `<span class="kind-tag quiet">${ICON.check}Runner's turn</span>`;
  return `<span class="kind-tag${a.kind === "broken" ? " broken" : ""}">${KIND_ICON[a.kind] || ""}${esc(askWords(a)[0])}</span>`;
}

function inbox() {
  const cur = pickAsk();
  // Opening an ask reads it, unless you just marked it unread.
  if (cur && !cur.answered && !snoozedUntil(cur) && !isRead(cur) && ui.hold !== cur.id) setRead(cur, true);
  const { all, open, snoozed, answered } = inboxLists();
  const blind = (snap.sources || []).find((s) => s.id === "github" && !s.ok);
  // A decided one says it in a sentence: what you said, and what the runner is doing with it.
  const doing = (a) => {
    const l = laneOn(a);
    return l ? `${l.name} is ${kind(l.job.kind)[0].toLowerCase()} ${l.job.ref}, ${ago(l.job.started_at)} in.` : a.answered.next;
  };
  const row = (a) => {
    const zz = snoozedUntil(a), quiet = !!(a.answered || zz), unread = !quiet && !isRead(a);
    const line = a.answered ? `You said "${a.answered.said}". ${doing(a)}` : zz ? `Back ${stamp(zz)}` : a.situation || a.question;
    const when = a.answered ? a.answered.at : a.since;
    const tools = rowTools(a), popped = ui.pop === `snooze:${a.id}`;
    return `<li class="${a === cur ? "cur" : ""}${popped ? " popped" : ""}" data-tools="${tools ? (zz ? 1 : 2) : 0}"><button class="mrow${zz ? " quiet" : ""}${unread ? " unread" : ""}" data-act="ask" data-id="${esc(a.id)}" aria-current="${a === cur}">
      <span class="m1">${repoMark(a.repo)}${kindTag(a)}
        ${zz ? "" : `<span class="ma" title="${a.answered ? "You answered" : "Waiting since"} ${esc(stamp(when))}">${esc(ago(when))}</span>`}</span>
      <span class="m2">${unread ? `<i class="dot" title="Unread"></i>` : ""}<b>${esc(a.subject)}</b><span>${esc(a.ref)}</span></span>
      <span class="m3">${esc(line)}</span></button>${tools}</li>`;
  };
  const oldest = open.reduce((m, a) => (!m || ms(a.since) < ms(m.since) ? a : m), null);
  const unread = open.filter((a) => !isRead(a)).length;
  const count = open.length ? `<b>${open.length} waiting on you</b><span>${unread ? `${unread} unread, ` : ""}oldest ${esc(ago(oldest.since))}</span>` : `<b>Nothing waiting</b>`;
  // A group at the foot of the list that folds to one line, remembered in this browser.
  const group = (id, name, xs, hint, mark = "") => {
    if (!xs.length) return "";
    const folded = recall(id) === "folded";
    return `<div class="fold">
      <button class="fold-head" data-act="fold" data-id="${id}" aria-expanded="${!folded}" title="${esc(hint)}">${ICON.chevron}<b>${name}</b>
        <span class="n">${mark}${xs.length}</span></button>
      ${folded ? "" : `<ol aria-label="${name}">${xs.map(row).join("")}</ol>`}</div>`;
  };
  const working = answered.filter(laneOn).length;
  const list = `<div class="mail-list"><p class="mail-count">${count}</p>
    <ol class="mail-rows" data-scroll="asks" aria-label="Waiting on you">${open.map(row).join("")}</ol>
    ${group("snoozed", "Snoozed", snoozed, "Out of the list until the time you chose. They still hold their work up.")}
    ${group("decided", "Decided", answered, "You've answered these. They stay until the runner is through with them.",
      working ? `<i class="pulse" title="${working} being worked on"></i>` : "")}</div>`;

  let right;
  if (cur) right = letter(cur);
  else {
    const calm = blind ? ["Nothing seen that waits on you", "GitHub can't be read, so something may be missing."]
      : ui.repo && all.length ? [`Nothing in ${esc(ui.repo)} waits on you`, `${plural(all.length, "thing waits", "things wait")} in another repository. <button class="link" data-act="repo" data-repo="">Show all repositories</button>`]
      : snoozed.length ? ["Nothing else waits on you", `${plural(snoozed.length, "ask is", "asks are")} snoozed.`]
      : ["Nothing waits on you", "The runner carries on by itself."];
    right = `<div class="letter none"><div class="calm">${ICON.done}<p class="calm-h">${calm[0]}</p><p class="mute">${calm[1]}</p></div></div>`;
  }
  const none = !open.length && !snoozed.length && !answered.length;   // nothing to list: the calm takes the whole card
  return `<section class="card mail${none ? " empty" : ""}" aria-label="Inbox">${none ? "" : list}${right}</section>`;
}

// ---- a row's icons: none on a decided ask (an answered ask can't be snoozed or marked today)
function rowTools(a) {
  if (a.answered) return "";
  const id = esc(a.id);
  if (snoozedUntil(a)) return `<span class="rtools"><button class="ricon" data-act="wake" data-id="${id}" aria-label="Unsnooze" data-tip="Unsnooze">${ICON.unsnooze}</button></span>`;
  const read = isRead(a), pop = `snooze:${a.id}`, open = ui.pop === pop, say = read ? "Mark unread" : "Mark read";
  const menu = open ? `<div class="pop row-pop" role="menu" aria-label="Snooze">
      <p class="pop-label">Out of the list until then. It still holds its work up.</p>
      ${snoozeChoices().map(([label, t]) => `<button class="mi" role="menuitem" data-act="snooze" data-id="${id}" data-until="${t.toISOString()}"><span class="two"><b>${label}</b><span>${esc(stamp(t.toISOString()))}</span></span></button>`).join("")}</div>` : "";
  return `<span class="rtools pop-root">
    <button class="ricon" data-act="unread" data-id="${id}" aria-label="${say}" data-tip="${say}">${read ? ICON.mail : ICON.mailopen}</button>
    <button class="ricon" data-act="pop" data-pop="${esc(pop)}" aria-haspopup="menu" aria-expanded="${open}" aria-label="Snooze" data-tip="Snooze">${ICON.snooze}</button>${menu}</span>`;
}
// Placed after each draw, under the clock (or over it, with no room below), inside the window.
function placeRowMenu() {
  const m = document.querySelector(".row-pop");
  if (!m) return;
  const b = m.parentElement.querySelector('[aria-haspopup="menu"]').getBoundingClientRect();
  const h = m.offsetHeight, w = m.offsetWidth;
  m.style.top = `${b.bottom + 6 + h <= innerHeight - 8 ? b.bottom + 6 : Math.max(8, b.top - 6 - h)}px`;
  m.style.left = `${Math.max(8, Math.min(b.right - w, innerWidth - w - 8))}px`;
  m.style.visibility = "visible";
}

// ---- the briefing's parts
function metaLine(a) {
  const zz = snoozedUntil(a);
  const when = a.answered ? `answered ${stamp(a.answered.at)}` : zz ? `snoozed until ${stamp(zz)}` : `waiting ${ago(a.since)}, since ${stamp(a.since)}`;
  return `<div class="letter-meta">${kindTag(a)}<span class="tag">${esc(a.repo)}</span><span>${esc(a.ref)}</span><span>${esc(when)}</span></div>`;
}
// Where it's answered carries that place's mark.
function goBtn(a, cls, label) {
  const where = a.go.where || (/github\.com/.test(a.go.url) ? "github" : "t3");
  return `<a class="btn ${cls}" href="${esc(a.go.url)}" target="_blank" rel="noreferrer">${{ github: MARK.github, t3: ICON.thread }[where] || ""}${esc(label || a.go.label)}${ICON.out}</a>`;
}
// Decide in T3 (ticket 35): an ask the runner can open a thread for offers one. Asked, it says so
// until the runner has read it, then when it starts; open, `go` is the thread and `also` the
// needs-info issue, the other place to answer. Stale (issue #72): the thread went cold and the
// runner settled it, so the button asks for a fresh thread (briefed with the cold one's last
// messages) instead of opening the cold one; a thread waiting for his answer offers it too.
function answerAt(a) {
  const d = a.decide;
  if (!d) return goBtn(a, "go");
  if (d.state === "open") return `${goBtn(a, "go")}${a.also ? `<a class="btn" href="${esc(a.also.url)}" target="_blank" rel="noreferrer">${MARK.github}${esc(a.also.label)}${ICON.out}</a>` : ""}`;
  const label = d.label || "Decide in T3";
  const want = ((ctl.asks || {})[a.id] || {})[d.state === "stale" ? "fresh" : "open"];
  const unread = want && want.at && !wasRead(want.at);
  if (d.state === "asked" || unread) {
    const note = unread ? `You asked at ${clock(want.at)}. The runner hasn't read it yet.` : d.note;
    return `<button class="btn go" disabled>${ICON.thread}${esc(label)}</button><p class="holds">${esc(note || "")}</p>${goBtn(a, "")}`;
  }
  if (frozen()) return goBtn(a, "go");
  if (d.state === "stale") return `<button class="btn go" data-act="fresh" data-id="${esc(a.id)}" title="The runner starts a fresh thread in T3 from the brief and the cold thread's last messages">${ICON.thread}${esc(label)}</button><p class="holds">${esc(d.note || "")}</p>${goBtn(a, "")}`;
  return `<button class="btn go" data-act="decide" data-id="${esc(a.id)}" title="The runner opens a thread in T3, briefed with this ask, to talk it through and decide in">${ICON.thread}Decide in T3</button>${goBtn(a, "")}`;
}
const holdsText = (a) => ((a.holds_up || []).length ? `Until then <b>${a.holds_up.map(esc).join("</b> and <b>")}</b> can't start.` : "It holds nothing else up.");
const historyLink = (a) => (a.pr ? prLink(a.repo, a.pr, "PR history") : "");
// `timeline` is each step with its time; a snapshot with only the older `story` still reads.
const steps = (a) => ((a.timeline || []).length ? a.timeline : (a.story || []).map((text) => ({ text })));
const storyList = (a) => `<ol class="timeline">${steps(a).map((e) => `<li>${e.at ? `<time datetime="${esc(e.at)}">${esc(stamp(e.at))}</time>` : ""}<p>${esc(e.text)}</p></li>`).join("")}</ol>`;
// ---- the briefing: the situation is the headline and the story reads down the left as a
// timeline; the ask stands beside it the whole way, never scrolled off.
function letter(a) {
  const done = a.answered;
  const options = (a.options || []).length ? `<ol class="vc-opts">${a.options.map((o) =>
    `<li><b>${esc(o.say)}</b>${o.recommended ? '<em class="rec">Recommended</em>' : ""}<span>${esc(o.means)}</span></li>`).join("")}</ol>` : "";
  const ask = done
    ? `<aside class="vc-ask answered"><p class="move-label">You answered</p><p class="question">${esc(done.said)}</p>
        <p class="holds">${esc(stamp(done.at))}. ${esc(done.next)}</p>${goBtn(a, "", "See where you answered")}<p class="vc-foot">${historyLink(a)}</p></aside>`
    : `<aside class="vc-ask"><p class="move-label">What it needs from you</p><p class="question">${esc(a.question)}</p>${options}
        <p class="holds">${holdsText(a)}</p>${answerAt(a)}<p class="vc-foot">${historyLink(a)}</p></aside>`;
  return `<article class="letter vc"><div class="vc-grid">
    <div class="vc-story" data-scroll="ask">${metaLine(a)}
      <h2>${esc(a.situation || a.subject)}</h2><p class="vc-sub"><b>${esc(a.subject)}</b></p>
      ${a.about ? `<section class="vc-sec"><h3>What it is</h3><p>${esc(a.about)}</p></section>` : ""}
      ${a.because ? `<section class="vc-sec"><h3>${esc(askWords(a)[1])}</h3><p>${esc(a.because)}</p></section>` : ""}
      ${steps(a).length ? `<section class="vc-sec"><h3>So far</h3>${storyList(a)}</section>` : ""}

// ------------------------------------------------------------------ overview
// The first glance, in three cards read top to bottom: what's on your plate, what's running,
// what's next. Each only summarises, and opens its page.
function overview() { return `<div class="ov">${plate()}${running()}${progress()}</div>`; }
const goto = (page, ask) => `href="${esc(href({ page, pr: null, ...(ask ? { ask: ask.id } : {}) }))}" data-act="page" data-page="${page}"${ask ? ` data-ask="${esc(ask.id)}"` : ""}`;

// ---- on your plate: the Inbox in counts by kind, how long the oldest has waited, and the ask
// the runner lists first, in a sentence.
const KINDS = ["stuck", "decision", "merge", "broken"];
function plate() {
  const { all, open, snoozed, answered } = inboxLists();
  const head = `<a class="ov-head" ${goto("inbox")}>${ICON.inbox}<h2>Inbox</h2><span class="to">Open the Inbox${ICON.right}</span></a>`;
  const aside = [snoozed.length ? `${snoozed.length} snoozed` : "", answered.length ? `${answered.length} decided, now with the runner` : ""].filter(Boolean).join(". ");
  if (!open.length) {
    const blind = (snap.sources || []).find((s) => s.id === "github" && !s.ok);
    const elsewhere = ui.repo ? all.filter((a) => a.repo !== ui.repo && !snoozedUntil(a)).length : 0;
    const calm = blind ? ["Nothing seen that waits on you", "GitHub can't be read, so something may be missing."]
      : elsewhere ? [`Nothing in ${esc(ui.repo)} waits on you`, `${plural(elsewhere, "thing waits", "things wait")} in another repository.`]
      : ["Nothing waits on you", "The runner carries on by itself."];
    return `<section class="card ov-inbox" aria-label="Inbox">${head}
      <div class="ov-calm">${ICON.done}<p><b>${calm[0]}</b><span>${calm[1]}${aside ? ` ${aside}.` : ""}</span></p></div></section>`;
  }
  const oldest = open.reduce((m, a) => (ms(a.since) < ms(m.since) ? a : m));
  const unread = open.filter((a) => !isRead(a)).length;
  const kinds = [...KINDS, ...new Set(open.map((a) => a.kind).filter((k) => !KINDS.includes(k)))].map((k) => {
    const its = open.filter((a) => a.kind === k), label = esc(askWords({ kind: k })[0]);
    if (!its.length) return `<li><span class="ov-kind none">${KIND_ICON[k] || "<i></i>"}<span class="k">${label}</span><span class="cells"></span><b>0</b></span></li>`;
    return `<li><a class="ov-kind${k === "broken" ? " broken" : ""}" ${goto("inbox", its[0])} title="${esc(its.map((a) => `${a.ref} ${a.subject}`).join("\n"))}">
      ${KIND_ICON[k] || "<i></i>"}<span class="k">${label}</span><span class="cells">${its.map(() => "<i></i>").join("")}</span><b>${its.length}</b></a></li>`;
  }).join("");
  const top = open[0];
  return `<section class="card ov-inbox has" aria-label="Inbox">${head}<div class="ov-in">
    <div class="ov-tally">
      <p class="ov-n">${open.length} waiting on you</p>
      <p class="ov-age" title="Waiting since ${esc(stamp(oldest.since))}">${unread ? `${unread} unread, ` : ""}oldest ${esc(ago(oldest.since))}</p>
      <ul class="ov-kinds" aria-label="By kind">${kinds}</ul>
      ${aside ? `<p class="ov-aside">${aside}.</p>` : ""}
    </div>
    <a class="ov-first" ${goto("inbox", top)}>
      <span class="lead">First in line</span>
      <span class="m1">${repoMark(top.repo)}${kindTag(top)}<span class="ma" title="Waiting since ${esc(stamp(top.since))}">${esc(ago(top.since))}</span></span>
      <span class="sit">${esc(top.situation || top.question)}</span>
      <span class="subj">${isRead(top) ? "" : `<i class="dot" title="Unread"></i>`}<b>${esc(top.subject)}</b> <span>${esc(top.ref)}</span></span>
    </a></div></section>`;
}

// ---- what's running: a line per lane. What it's doing and for how long, or why it isn't; its
// Stop button; and the one thing it takes up next (its whole queue is the Queue page's).
function running() {
  const lanes = snap.lanes || [];
  return `<section class="card" aria-label="Running now"><header class="ov-head">${ICON.activity}<h2>Running now</h2></header>
    ${lanes.length ? lanes.map(lane).join("") : `<p class="empty">The snapshot names no lane.</p>`}</section>`;
}

// One Stop button. While a job runs it asks which stop you mean.
function stopButton(l) {
  if (frozen()) return "";
  const a = asked(l), want = a ? a.stop : null, off = l.state === "stopped" || l.state === "stopping";
  const now = l.stop_now || {}, id = esc(l.id), pop = `stop-${l.id}`, noun = kind(l.job && l.job.kind)[1];
  if (want || off) return `<button class="btn solid" data-act="stop" data-lane="${id}" data-how="">${ICON.play}${l.state === "stopped" ? "Resume" : "Carry on"}</button>`;
  if (l.state === "working" && l.job) return `<span class="pop-root"><button class="btn" data-act="pop" data-pop="${esc(pop)}" aria-haspopup="menu" aria-expanded="${ui.pop === pop}">${ICON.pause}Stop</button>
      ${ui.pop === pop ? `<div class="pop right" role="menu" aria-label="Stop ${esc(l.name)}">
        <button class="mi" role="menuitem" data-act="stop" data-lane="${id}" data-how="after-job"><span class="two"><b>After this ${esc(noun)}</b><span>It finishes the ${esc(noun)}, then starts nothing.</span></span></button>
        <button class="mi danger" role="menuitem" data-act="stop" data-lane="${id}" data-how="now" ${now.available ? "" : "disabled"}><span class="two"><b>Now</b><span>${esc(now.available ? now.effect || "Cuts the job off." : now.note || "Unavailable.")}</span></span></button></div>` : ""}</span>`;
  return `<button class="btn" data-act="stop" data-lane="${id}" data-how="after-job" title="It starts nothing until you resume it">${ICON.pause}Stop</button>`;
}

// What a lane is doing, in words: for how long (or what it is instead), what it's on, the detail,
// and a note while something you asked of it hasn't been read. The Queue's lanes say the same.
function laneSays(l) {
  const stale = frozen();
  const job = l.job, [doing, noun] = kind(job && job.kind);
  const a = asked(l), pending = a && !wasRead(a.at), want = a ? a.stop : null;
  const off = l.state === "stopped" || l.state === "stopping";

  let how, head, sub = "";   // for how long (or what it is instead), what it's doing, and the detail
  if (l.state === "stopped") {
    how = "Stopped by you";
    head = l.stopped && l.stopped.at ? `Stopped at ${esc(clock(l.stopped.at))}` : "Stopped";
    sub = l.stopped && l.stopped.during ? `It was cut off during ${esc(l.stopped.during)}.` : "It starts nothing until you resume it.";
  } else if (l.state === "waiting") {
    how = "Waiting";
    head = l.wait && l.wait.until ? `Waiting until ${esc(stamp(l.wait.until))}` : "Waiting";
    sub = esc((l.wait && l.wait.reason) || "");
  } else if (job && laneJobs(l).length > 1) {   // one job per repository at once (#50)
    const jobs = laneJobs(l);
    how = `${l.state === "stopping" ? "Stopping, " : ""}${jobs.length} at once`;
    head = jobs.map((j) => `${esc(kind(j.kind)[0])} ${esc(j.ref)} in ${esc(j.repo)}`).join("; ");
    sub = jobs.map((j) => `${esc(j.ref)} ${esc(j.title)}, ${esc(ago(j.started_at))} in.${j.thread ? ` <a class="link" href="${esc(j.thread)}" target="_blank" rel="noreferrer">Open the thread</a>` : ""}`).join("<br>");
  } else if (job) {
    how = `${l.state === "stopping" ? "Stopping, " : ""}${esc(ago(job.started_at))}`;
    head = `${esc(doing)} ${esc(job.ref)} ${esc(job.title)}`;
    sub = `In ${esc(job.repo)}${job.sha ? `, on head <span class="sha">${esc(job.sha)}</span>` : ""}.`;
    if (job.thread) sub += ` <a class="link" href="${esc(job.thread)}" target="_blank" rel="noreferrer">Open the thread</a>`;
    if (job.pr) sub += ` ${prLink(job.repo, job.pr, "PR history")}`;
  } else { how = "Idle"; head = "Nothing to do right now"; }
  const moving = !stale && !!job && (l.state === "working" || l.state === "stopping");
  if (stale) how = "Last recorded";

  let note = "";
  if (pending && want) note = `You asked it to stop ${want === "now" ? "now" : `after this ${esc(noun)}`} at ${esc(clock(a.at))}. The runner hasn't read that yet.`;

function lane(l) {
  const { how, head, sub, note, moving, job } = laneSays(l);
  // A lane is one across repositories, so its next is never narrowed to the picked one.
  const queue = l.queue || [], q = queue[0];

    ? `Next: <b>${esc(QUEUED[q.kind] || q.kind)} ${esc(q.ref)}</b> ${esc(q.title)}${queue.length > 1 ? `, <a class="link" ${goto("queue")}>then ${queue.length - 1} more</a>` : ""}`

// ---- what's next: a feature's progress as one bar.
// Left to right, and done means live. Each: its class, its name, the issue states it covers.
const SEGMENTS = [
  ["done", "Done", ["done"]], ["merged", "Merged, not live", ["merged"]], ["pr", "In a PR", ["review", "fixing", "fixing-itself"]],
  ["building", "Building", ["building"]], ["yours", "Waiting on you", ["you", "ready-for-human", "needs-triage"]], ["ready", "Ready", ["ready"]],
  ["blocked", "Blocked", ["blocked", "not-ready"]],

const segmentOf = (i) => { const k = SEGMENTS.findIndex((s) => s[2].includes(i.state)); return k < 0 ? SEGMENTS.length - 1 : k; };

const featureCells = (f) => (snap.issues || []).filter((i) => i.feature === f.id).map((i) => [i, segmentOf(i)]).sort((a, b) => a[1] - b[1] || a[0].n - b[0].n);

function featureBar(f) {

  return `<span class="fbar" role="img" aria-label="${esc(f.title)}: ${esc(said || "no tickets")}">${cells.map(([i, k]) =>

const askFor = (i) => (snap.asks || []).find((a) => a.repo === i.repo && (a.ref === `#${i.n}` || (i.pr && a.pr === i.pr)));

function featureNext(f, m) {
  const its = featureCells(f).map((c) => c[0]), named = (i) => `#${i.n} ${esc(i.title)}`;
  const mine = its.filter((i) => i.state === "you");
  if (mine.length) {
    const order = (snap.asks || []).map((a) => a.id), at = (i) => { const k = order.indexOf((askFor(i) || {}).id); return k < 0 ? 99 : k; };
    const first = [...mine].sort((a, b) => at(a) - at(b))[0], ask = askFor(first);
    const text = `<b>Waits on you:</b> ${named(first)}${mine.length > 1 ? `, and ${mine.length - 1} more` : ""}`;

const TOP_FEATURES = 3;
function progress() {
  const m = model();

  const feats = scoped(snap.features || []).filter(open), top = feats.slice(0, TOP_FEATURES);

}

// ------------------------------------------------------------------ the work, as every page reads it
function model() {
  const issues = snap.issues || [];
  const byKey = new Map(issues.map((i) => [key(i), i]));
  const dependents = new Map();
  for (const i of issues) for (const b of i.blocked_by || []) dependents.set(b, [...(dependents.get(b) || []), key(i)]);
  const below = (k) => {       // every open item that can't start until k is done

    walk(k);

  const waitsOn = (i) => (i.blocked_by || []).map((b) => byKey.get(b)).filter((b) => b && b.state !== "done");
  const rank = new Map((snap.repos || []).map((r, n) => [r.name, n]));
  const order = (a, b) => (rank.get(a.repo) ?? 99) - (rank.get(b.repo) ?? 99) || a.n - b.n;
  const feature = (i) => (snap.features || []).find((f) => f.id === i.feature);
  return { issues, shown: scoped(issues), byKey, dependents, below, waitsOn, order, feature };
}

// ------------------------------------------------------------------ queue

// A bar for any list of tickets, in the order given: a cell per ticket, named on hover.
function ticketBar(title, its) {

// What stands between a feature and usable, in a sentence: what waits on you first.
const LEFT = [["yours", "waits on you", "wait on you"], ["building", "building"], ["pr", "in a PR"], ["merged", "merged but not live"], ["ready", "ready"], ["blocked", "blocked"]];
function leftSay(v, link = true) {

  const parts = LEFT.map(([seg, one, many]) => {

    if (!its.length) return "";
    const text = `${its.length} ${its.length === 1 ? one : many || one}`;
    if (seg !== "yours") return text;

    return link && ask ? `<a class="mine" ${goto("inbox", ask)}>${text}</a>` : `<span class="mine">${text}</span>`;
  }).filter(Boolean);

const countSay = (v) => (v.loose ? plural(v.left, "open ticket", "open tickets") : `${v.done} of ${v.its.length} done`);

// ------------------------------------------------------------------ queue
// PROTOTYPE (#30, take 11), on sample data: the Queue as #107 and #109 decide it, three ways.
// One queue per repo, each entry with the sentence that says why; every open ticket's state,
// ready-for-human and needs-triage by those names; efforts as a tree with a "No effort" group per
// repo; a stuck item as "fixing itself: #N"; and each repo's order changed by dragging (or Alt+Up

function work() {

  const byKey = new Map(issues.map((i) => [key(i), i]));
  const outside = new Map((snap.outside || []).map((o) => [o.key, o]));
  const nodes = new Map();
  for (const r of repos) nodes.set(`repo:${r}`, { t: "repo", id: `repo:${r}`, repo: r, kids: [] });
  for (const e of snap.efforts || []) nodes.set(e.id, { t: "effort", ...e, parent: e.parent || `repo:${e.repo}`, kids: [] });
  for (const r of repos) nodes.set(`none:${r}`, { t: "none", id: `none:${r}`, repo: r, n: null, title: "No effort", parent: `repo:${r}`, blocked_by: [], kids: [] });

  for (const n of nodes.values()) if (n.parent && nodes.has(n.parent)) nodes.get(n.parent).kids.push(n.id);

    if (n.t === "ticket") continue;

    n.order = [...mine, ...live.filter((k) => !mine.includes(k)).sort((a, b) => low(a) - low(b))];

  const top = (id) => { const a = [id, ...ancestors(id)]; return a[a.length - 2]; };   // its branch at the repo's top

  const blockersOf = (i) => [

  ].filter(({ b }) => outside.has(b) || (byKey.has(b) && isOpen(byKey.get(b))));

  const claude = (snap.lanes || []).find((l) => l.id === "claude") || {};

        else if (!prev) why = t === root.order[0] ? `The first ready ticket in ${nameOf(nodes.get(t))}, the top of the order${mine}`

    jobs.forEach((j, x) => { const i = j.key ? byKey.get(j.key) : issues.find((i) => i.repo === r && i.pr && j.ref === `PR #${i.pr}`); if (i) qpos.set(key(i), x + 1); });

}
const nameOf = (n) => (!n ? "" : n.t === "none" ? "No effort" : n.t === "repo" ? n.repo : n.t === "ticket" ? `#${n.i.n} ${n.i.title}` : n.title);

const dragAttrs = (n) => (repoOff(n.repo) || (n.t === "ticket" && !n.parent.startsWith("repo:")) ? "" : `draggable="true" tabindex="0" data-drag="${esc(n.id)}" data-parent="${esc(n.parent)}" aria-roledescription="${n.t === "ticket" ? "ticket" : "effort"}, drag to reorder"`);
const KINDNAME = { map: "Map", spec: "Spec" };

// What a repo is doing now and takes up next, in order, each with why.
function nowLine(q) {

  if (q.doing) return `<p class="q-now"><i class="dot run"></i><b>${esc(kind(q.doing.kind)[0])} ${esc(q.doing.ref)}</b> ${esc(q.doing.title)}<span class="mute">, ${esc(ago(q.doing.started_at))} in</span></p>`;
  return `<p class="q-now quiet">Nothing running here. ${esc(q.starts || "The next job starts when the gate admits it.")}</p>`;
}
const jobLabel = (j) => `${QUEUED[j.kind] || j.kind} ${j.ref}`;
function queueList(q, cls = "") {
  if (!q.jobs.length) return `<p class="empty small">${repoOff(q.repo) ? "Nothing: the repository is stopped." : "Nothing is ready to start."}</p>`;
  return `<ol class="jobs ${cls}">${q.jobs.map((j, x) => `<li class="${j.kind === "build" ? "" : "pre"}${j.key && isFlash(j.key) ? " flash" : ""}"><span class="n">${x + 1}</span>
    <span class="j"><b>${esc(jobLabel(j))}</b> ${esc(j.title)}</span><span class="why">${esc(j.why)}</span></li>`).join("")}</ol>`;

function moveNote() {

  return `<div class="q-moved${says ? " has" : ""}" role="status">${says ? `<ul>${says}</ul>` : `<p class="mute">The order you set holds in this page until you reload it (prototype).</p>`}<span class="q-tools">${tools}</span></div>`;

function finished(r, W) {
  const root = W.nodes.get(`repo:${r}`), done = root.closed.map((k) => W.nodes.get(k)).filter((n) => n.t !== "none");
  return done.length ? `<p class="q-finished">${ICON.done}Finished: ${done.map((n) => `${esc(n.title)} <span class="mute">#${n.n}</span>`).join(", ")}. A finished effort leaves the order.</p>` : "";

const repoHead = (r, W, extra = "") => {

// ------------------------------------------------------------------ queue, take 12
// PROTOTYPE (#30, take 12, Stefan 2026-11-17): what runs now on top, a lane per provider with what
// it takes up next; then the efforts in the order they're built, three ways: a list you drag (an
// effort among its siblings; a ticket goes where its effort and what it waits on put it), a board
// by state, and the graph of what waits on what. An effort is closed until you open it, and stays
// as you left it. Variant A: a ticket with no effort is a row of its own in the order. Variant B:
// they're one "No effort" row.
const QVIEWS = [["list", "List"], ["board", "Board"], ["graph", "Graph"]];
const qOpen = new Set((() => { try { return JSON.parse(recall("qopen") || "[]"); } catch { return []; } })());
// The sample addresses can open efforts and pick a view (?qopen=id,id&qview=board), for screenshots.
{ const q = new URLSearchParams(location.search); if (q.get("qopen")) q.get("qopen").split(",").forEach((id) => qOpen.add(id)); if (q.get("qview")) ui.qview = q.get("qview"); }
function toggleOpen(id) { if (qOpen.has(id)) qOpen.delete(id); else qOpen.add(id); remember("qopen", JSON.stringify([...qOpen])); }
const qMore = new Set();   // board columns shown whole

function queue() {
  if (!QVIEWS.some((v) => v[0] === ui.qview)) ui.qview = QVIEWS.some((v) => v[0] === recall("qview")) ? recall("qview") : "list";
  const W = work();
  if (ui.qeffort && !(W.nodes.has(ui.qeffort) && W.repos.includes(W.nodes.get(ui.qeffort).repo))) ui.qeffort = "";
  const view = { list: qList, board: qBoard, graph: qGraph }[ui.qview];
  const hint = { list: "In the order they're built. Drag an effort to build it sooner or later.", board: "Every open ticket by where it stands.", graph: "A blocker above what it blocks." }[ui.qview];
  return `<div class="q12">${moveNote()}${qNow(W)}
    <section class="card q12-work" aria-label="Efforts"><header class="q12-head"><h2>Efforts</h2><span class="q12-hint">${hint}</span>
      ${ui.qview === "list" ? "" : effortPick(W)}

      ${view(W)}</section></div>${protoBar()}`;
}

// ---- the lanes: what each provider runs now, then what it takes up next.
function qNow(W) {
  const lanes = snap.lanes || [];
  return `<div class="q12-now">${lanes.map((l) => (l.provider === "claude" ? claudeLane(l, W) : reviewLane(l, W))).join("")}</div>`;
}
function laneCard(l, doing, then, more) {
  const { how, moving } = laneSays(l);
  return `<article class="ln${moving ? " on" : ""}" aria-label="${esc(l.name)}">
    <header class="ln-head">${who(l.provider, l.name)}<span class="ln-does">${esc(l.does || "")}</span>
      <span class="ln-for${moving ? " run" : ""}">${moving ? `<i class="dot run"></i>` : ""}${how}</span><span class="ln-stop">${stopButton(l)}</span></header>

}
const thenRow = (x, label, title, why, repo) => `<li><span class="qn">${x}</span><span class="ln-j"><b>${esc(label)}</b> ${esc(title)}${repo ? ` <span class="ln-repo">${esc(repo)}</span>` : ""}</span><span class="ln-why">${esc(why || "")}</span></li>`;
function doingLine(j) {

}
function claudeLane(l, W) {

  const doing = jobs.length ? jobs.map(doingLine).join("")
    : elsewhere.length ? `<p class="ln-now quiet">Nothing running in ${esc(W.repos.join(", "))}<span class="ln-meta">It's on ${esc(elsewhere.join(", "))} now.${one && one.starts ? ` ${esc(one.starts)}` : ""}</span></p>`
    : `<p class="ln-now quiet">${s.head}${s.sub ? `<span class="ln-meta">${s.sub}</span>` : ""}</p>`;
  let then = [], more = "";
  if (W.repos.length === 1) {
    const q = W.queues.get(W.repos[0]);
    then = q.jobs.slice(0, 3).map((j, x) => thenRow(x + 1, jobLabel(j), j.title, j.why));
    if (q.jobs.length > 3) more = `Then ${plural(q.jobs.length - 3, "more", "more")}, in the order below.`;
    else if (!q.jobs.length && !elsewhere.length) more = esc(q.starts || "");
  } else {
    // A job per repository at once (#50): each repository's next.
    then = W.repos.map((r) => W.queues.get(r)).filter((q) => q.jobs.length).map((q, x) => thenRow(x + 1, jobLabel(q.jobs[0]), q.jobs[0].title, q.jobs[0].why, q.repo));
    more = "One job per repository at once. Pick a repository to see its whole queue.";

}
function reviewLane(l, W) {
  const s = laneSays(l), job = l.job && W.repos.includes(l.job.repo) ? l.job : null;
  const doing = job ? doingLine(job) : `<p class="ln-now quiet">${l.job ? `Reviewing in ${esc(l.job.repo)}` : s.head}</p>`;
  const rank = new Map((snap.repos || []).map((r, n) => [r.name, n]));

    .sort((a, b) => (rank.get(a.repo) ?? 99) - (rank.get(b.repo) ?? 99) || a.pr - b.pr);

// ---- where an effort stands, in a line: what's moving, what's next, what waits on you.
function effortStatus(n, W) {
  const its = W.openIn(n.id);
  if (!its.length) return `<span class="es ok">Usable</span> Every ticket is live.`;
  const yours = its.filter((i) => ["you", "ready-for-human", "needs-triage"].includes(i.state));
  const building = its.find((i) => i.state === "building");
  const queued = its.filter((i) => W.qpos.get(key(i))).sort((a, b) => W.qpos.get(key(a)) - W.qpos.get(key(b)))[0];
  const inPr = its.find((i) => ["review", "fixing", "fixing-itself"].includes(i.state));
  const heldBy = (n.blocked_by || []).map((b) => (W.outside.has(b) ? { ...W.outside.get(b), outside: true } : W.byKey.get(b))).filter((b) => b && (b.outside || isOpen(b)));
  const youSay = yours.length ? `<span class="es you">${plural(yours.length, "waits on you", "wait on you")}</span>` : "";
  let lead;
  if (heldBy.length) { const b = heldBy[0], root = rootOf(b, W); lead = `<span class="es held">Held</span> Waits on ${esc(refOf(b, n.repo))}${heldSay(root) ? `, which ${esc(heldSay(root))}` : ""}`; }
  else if (building) { const j = W.doing.get(building.repo); lead = `<span class="es run">Building #${building.n}</span> ${esc(building.title)}${j && j.ref === `#${building.n}` ? `, ${esc(ago(j.started_at))}` : ""}`; }
  else if (queued) lead = `<span class="es next">Next: #${queued.n}</span> ${esc(queued.title)}, ${W.qpos.get(key(queued)) === 1 ? "first" : nth(W.qpos.get(key(queued)))} in line`;
  else if (inPr) lead = `<span class="es run">${esc(stateOf(inPr)[0])}: #${inPr.n}</span> ${esc(inPr.title)}`;
  else if (yours.length) { const i = yours[0]; return `<span class="es you">Waits on you: #${i.n}</span> ${esc(i.title)}${yours.length > 1 ? `, and ${yours.length - 1} more` : ""}`; }
  else { const i = its.find((x) => x.state === "blocked") || its[0]; lead = `<span class="es">#${i.n}</span> ${esc(whyOf(i, W))}`; }
  return `${lead}${youSay ? ` · ${youSay}` : ""}`;
}

// ---- List: the order itself. Efforts closed until opened; a ticket isn't dragged on its own.
function qList(W) {
  if (!W.repos.length) return `<p class="empty">No repository.</p>`;
  return W.repos.map((r) => {
    const root = W.nodes.get(`repo:${r}`);
    const head = W.repos.length > 1 ? `<h3 class="q12-repo">${repoLogo(r)}${esc(r)}${offTag(r)}</h3>` : "";
    const rows = root.order.length ? `<ol class="er-list">${root.order.map((k, x) => erRow(W.nodes.get(k), W, x + 1)).join("")}</ol>` : `<p class="empty small">Nothing open.</p>`;
    return `<div class="q12-sec">${head}${rows}${finished(r, W)}</div>`;
  }).join("");
}
function erRow(n, W, rank) {
  const flash = isFlash(n.id) ? " flash" : "", num = rank ? `<span class="er-rank">${rank}</span>` : "";
  if (n.t === "ticket") {   // a ticket with no effort: a row of its own in the order (variant A)
    const i = n.i;
    return `<li class="er er-loose${flash}" ${dragAttrs(n)}><div class="er-head">${GRIP}${num}<span class="er-caret dot-only"><i></i></span>
      <span class="er-name"><span class="t-n">#${i.n}</span>${esc(i.title)}<span class="kind">Ticket</span>${prText(i)}</span>
      <span class="er-st">${stateTag(i)}</span><span class="er-say">${esc(whyOf(i, W))}</span></div></li>`;
  }
  const open = qOpen.has(n.id), s = effortSum(n, W), shut = closedSay(n, W);
  const title = n.t === "none" ? `No effort<span class="kind">Tickets</span>` : `${esc(n.title)}<span class="kind">${esc(KINDNAME[n.kind] || "Effort")}</span>`;
  const kids = open ? n.order.map((k) => { const c = W.nodes.get(k); return c.t === "ticket" ? etRow(c, W) : erRow(c, W, null); }).join("") : "";
  return `<li class="er${open ? " open" : ""}${n.t === "none" ? " none" : ""}${flash}" ${dragAttrs(n)}>
    <div class="er-head">${GRIP}${num}<button class="er-caret" data-act="q-open" data-id="${esc(n.id)}" aria-expanded="${open}" aria-label="${open ? "Close" : "Open"} ${esc(nameOf(n))}">${ICON.right}</button>
      <button class="er-name" data-act="q-open" data-id="${esc(n.id)}">${title}</button>
      <span class="er-bar">${s.bar}</span><span class="er-count">${esc(s.count)}</span>

}
function etRow(n, W) {
  const i = n.i, at = W.qpos.get(n.id);
  return `<li class="et${isFlash(n.id) ? " flash" : ""}"><span class="qn${at ? "" : " none"}"${at ? ` title="${nth(at)} in ${esc(i.repo)}'s queue"` : ""}>${at || ""}</span>
    <span class="et-name"><span class="t-n">#${i.n}</span>${esc(i.title)}${prText(i)}${filedTag(i)}</span>
    <span class="et-st">${stateTag(i)}${fixTag(i)}</span><span class="et-why">${esc(whyOf(i, W))}</span></li>`;

// ---- the efforts to narrow the board and the graph to: a dropdown, however many there are.
function effortPick(W) {
  const opts = [];
  const walk = (id, depth) => { const n = W.nodes.get(id); for (const k of n.order) { const c = W.nodes.get(k); if (c.t === "ticket") continue; opts.push([k, `${"   ".repeat(depth)}${nameOf(c)}`]); walk(k, depth + 1); } };
  for (const r of W.repos) { if (W.repos.length > 1) opts.push([`repo:${r}`, r, true]); walk(`repo:${r}`, W.repos.length > 1 ? 1 : 0); }
  return `<select class="q12-pick" data-change="q-effort" aria-label="Narrow to an effort"><option value="">All efforts</option>${opts.map(([v, label, grp]) =>
    `<option value="${esc(v)}"${ui.qeffort === v ? " selected" : ""}${grp ? ' class="grp"' : ""}>${esc(label)}</option>`).join("")}</select>`;
}
const effortSet = (W) => (ui.qeffort ? new Set(W.tickets(ui.qeffort).map(key)) : null);
const effortOf = (k, W) => { const p = W.nodes.get(W.nodes.get(k).parent); return p && p.t !== "repo" ? nameOf(p) : "No effort"; };

// ---- Board: every open ticket by where it stands, each column in build order.
const QCOLS = [
  ["next", "Up next", (i, W) => i.state === "ready" && !!W.qpos.get(key(i))],
  ["moving", "Moving", (i) => ["building", "review", "fixing", "fixing-itself", "merged"].includes(i.state)],
  ["you", "Waits on you", (i) => ["you", "ready-for-human", "needs-triage"].includes(i.state)],
  ["blocked", "Blocked", (i, W) => i.state === "blocked" || (i.state === "ready" && !W.qpos.get(key(i)))],
  ["done", "Done", (i) => i.state === "done"],
];
const QLIMIT = 6;
function qBoard(W) {
  const only = effortSet(W);
  const its = (snap.issues || []).filter((i) => W.repos.includes(i.repo) && (!only || only.has(key(i))));
  const byPos = (a, b) => (W.qpos.get(key(a)) || 999) - (W.qpos.get(key(b)) || 999) || (W.repos.indexOf(a.repo) - W.repos.indexOf(b.repo)) || (W.pos.get(key(a)) ?? 999) - (W.pos.get(key(b)) ?? 999);
  const cols = QCOLS.map(([id, label, test]) => {
    const all = its.filter((i) => test(i, W)).sort(byPos), whole = qMore.has(id), limit = id === "done" ? 0 : QLIMIT;
    const shown = whole ? all : all.slice(0, limit), rest = all.length - shown.length;
    const cards = shown.map((i) => {
      const at = W.qpos.get(key(i));
      return `<li class="kc ${id}"><p class="kc-t">${id === "next" && at ? `<span class="qn">${at}</span>` : ""}<span class="t-n">#${i.n}</span>${esc(i.title)}</p>
        <p class="kc-m">${id === "next" || id === "blocked" || id === "done" ? "" : stateTag(i)}<span class="kc-e">${esc(effortOf(key(i), W))}</span>${W.repos.length > 1 ? `<span class="kc-r">${esc(i.repo)}</span>` : ""}</p>
        ${id === "done" ? "" : `<p class="kc-why">${esc(whyOf(i, W))}</p>`}</li>`;
    }).join("");
    const toggle = rest > 0 ? `<button class="kc-more" data-act="q-more" data-col="${id}">${id === "done" && !whole ? `Show ${all.length}` : `${rest} more`}</button>`
      : whole && all.length > limit ? `<button class="kc-more" data-act="q-more" data-col="${id}">Show fewer</button>` : "";
    return `<section class="kcol ${id}" aria-label="${label}"><h3>${label}<span>${all.length}</span></h3>${cards ? `<ol>${cards}</ol>` : id === "done" ? "" : `<p class="kc-empty">None</p>`}${toggle}</section>`;
  }).join("");
  return `<div class="kboard">${cols}</div>`;
}

// ---- Graph: the pyramid (take 9), narrowed to the effort picked.
function qGraph(W) {
  const m = model(), only = effortSet(W);
  m.shown = m.issues.filter((i) => W.repos.includes(i.repo) && (!only || only.has(key(i))));
  return `<div class="q12-graph">${pyramid(m)}</div>`;
}

// ---- dragging (#109): an effort among its siblings, a ticket within its effort; whatever it
// waits on comes up with it, in another repository too.
function moveTo(id, parent, target, before) {
  undo.push(JSON.stringify({ kids: ord.kids, touched: [...ord.touched] }));
  const W = work(), was = W.nodes.get(parent).order.join(), list = W.nodes.get(parent).order.filter((k) => k !== id);
  list.splice(list.indexOf(target) + (before ? 0 : 1), 0, id);
  ord.kids[parent] = list; ord.touched.add(id);
  lastMove = { at: Date.now(), ...bringUp(id) };
  if (work().nodes.get(parent).order.join() === was) lastMove.says.push("So the order is as it was: what it waits on has to come first.");
}
function bringUp(id) {
  const ids = new Set([id]), says = [], seen = new Set();
  const label = (W, k) => { const n = W.nodes.get(k); return n.t === "ticket" ? `#${n.i.n}` : `<b>${esc(nameOf(n))}</b>`; };
  const need = (bk, tk, via, depth) => {   // bk must be built before tk
    if (depth > 24 || seen.has(`${bk}>${tk}`)) return;
    seen.add(`${bk}>${tk}`);
    let W = work();
    const t = W.byKey.get(tk), waiter = via ? `<b>${esc(via.title)}</b>` : `#${t.n}`;
    if (W.outside.has(bk)) { says.push(`${waiter} waits on ${esc(bk)}, in a repository the runner doesn't serve: it can't be moved.`); return; }
    const b = W.byKey.get(bk);
    if (b.repo === t.repo) {
      if (W.pos.get(bk) > W.pos.get(tk)) {
        const ab = [bk, ...W.ancestors(bk)], at = [tk, ...W.ancestors(tk)], lca = ab.find((x) => at.includes(x));
        const bb = ab[ab.indexOf(lca) - 1], tb = at[at.indexOf(lca) - 1];
        const list = W.nodes.get(lca).order.filter((k) => k !== bb);
        list.splice(list.indexOf(tb), 0, bb);
        ord.kids[lca] = list; ids.add(bb);
        says.push(`${label(W, bb)} came up with it: ${waiter} waits on #${b.n}${bb === bk ? "" : `, which is in ${esc(nameOf(W.nodes.get(bb)))}`}.`);
      }
    } else {
      const chain = [bk, ...W.ancestors(bk)];
      let moved = null;
      for (let x = chain.length - 1; x > 0; x--) {
        const order = W.nodes.get(chain[x]).order, kid = chain[x - 1];
        if (order[0] !== kid) { ord.kids[chain[x]] = [kid, ...order.filter((k) => k !== kid)]; ids.add(kid); moved = moved || kid; }
      }
      if (moved) says.push(`In ${esc(b.repo)}, ${label(W, moved)} went to the top: ${t.repo}#${t.n}${via ? ` (${esc(via.title)})` : ""} waits on ${b.repo}#${b.n}.`);
    }
    W = work();
    for (const x of W.blockersOf(b)) need(x.b, bk, x.via, depth + 1);
  };
  const W = work();
  for (const t of W.openIn(id)) for (const x of W.blockersOf(t)) need(x.b, key(t), x.via, 0);
  return { ids, says };
}
const clearMarks = () => document.querySelectorAll(".drop-before, .drop-after").forEach((el) => el.classList.remove("drop-before", "drop-after"));
function dropTarget(e) {
  if (!dragging) return null;
  let el = e.target.closest ? e.target.closest("[data-drag]") : null;
  while (el && el.dataset.parent !== dragging.parent) el = el.parentElement ? el.parentElement.closest("[data-drag]") : null;
  if (!el || el.dataset.drag === dragging.id) return null;
  const r = el.getBoundingClientRect();
  return { el, before: e.clientY < r.top + r.height / 2 };
}
document.addEventListener("dragstart", (e) => {
  const el = e.target.closest ? e.target.closest("[data-drag]") : null;
  if (!el) return;
  dragging = { id: el.dataset.drag, parent: el.dataset.parent };
  e.dataTransfer.effectAllowed = "move";
  e.dataTransfer.setData("text/plain", dragging.id);
  document.body.classList.add("q-dragging");
  requestAnimationFrame(() => {
    el.classList.add("dragging");
    document.querySelectorAll("[data-drag]").forEach((x) => { if (x.dataset.parent === dragging.parent && x !== el) x.classList.add("can-drop"); });
  });
});
document.addEventListener("dragover", (e) => {
  const t = dropTarget(e);
  clearMarks();
  if (!t) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = "move";
  t.el.classList.add(t.before ? "drop-before" : "drop-after");
});
document.addEventListener("drop", (e) => {
  const t = dropTarget(e);
  clearMarks();
  if (!t) return;
  e.preventDefault();
  moveTo(dragging.id, dragging.parent, t.el.dataset.drag, t.before);
});
document.addEventListener("dragend", () => {
  clearMarks();
  dragging = null;
  document.body.classList.remove("q-dragging");
  draw();
});
// Alt+Up and Alt+Down move the focused row among its siblings, the same rules as a drag.
document.addEventListener("keydown", (e) => {
  if (ui.page !== "queue" || !e.altKey || !["ArrowUp", "ArrowDown"].includes(e.key)) return;
  const el = e.target.closest ? e.target.closest("[data-drag]") : null;
  if (!el) return;
  e.preventDefault();
  const id = el.dataset.drag, parent = el.dataset.parent, order = work().nodes.get(parent).order, at = order.indexOf(id);
  const to = order[at + (e.key === "ArrowUp" ? -1 : 1)];
  if (!to) return;
  moveTo(id, parent, to, e.key === "ArrowUp");
  draw();
  const back = [...document.querySelectorAll("[data-drag]")].find((x) => x.dataset.drag === id);
  if (back) back.focus();
});

// The pyramid: each group of linked items drawn in layers, a blocker above what it blocks, so the
// top row is where work can start.
const NW = 214, NH = 60, GX = 14, GY = 30;
function pyramid(m) {
  const link = new Map();
  const tie = (a, b) => { if (!link.has(a)) link.set(a, new Set()); link.get(a).add(b); };
  for (const i of m.shown) for (const b of i.blocked_by || []) if (m.byKey.has(b)) { tie(b, key(i)); tie(key(i), b); }
  const seen = new Set(), groups = [];
  for (const start of link.keys()) {
    if (seen.has(start)) continue;
    const members = [], stack = [start];
    while (stack.length) { const x = stack.pop(); if (seen.has(x)) continue; seen.add(x); members.push(x); link.get(x).forEach((y) => stack.push(y)); }
    const inside = new Set(members), depth = new Map();
    const layerOf = (k) => {
      if (depth.has(k)) return depth.get(k);
      depth.set(k, 0);   // guards against a cycle in the blockers
      const d = Math.max(0, ...(m.byKey.get(k).blocked_by || []).filter((b) => inside.has(b)).map((b) => layerOf(b) + 1));
      depth.set(k, d);
      return d;
    };
    members.forEach(layerOf);
    const layers = [];
    for (const k of members) (layers[depth.get(k)] ??= []).push(k);
    layers.forEach((row) => row.sort((a, b) => m.order(m.byKey.get(a), m.byKey.get(b))));
    const widest = Math.max(...layers.map((row) => row.length));
    const width = widest * NW + (widest - 1) * GX;
    const pos = new Map();
    layers.forEach((row, d) => {
      const off = (width - (row.length * NW + (row.length - 1) * GX)) / 2;
      row.forEach((k, n) => pos.set(k, { x: off + n * (NW + GX), y: d * (NH + GY) }));
    });
    const edges = [];
    for (const k of members) for (const b of m.byKey.get(k).blocked_by || []) if (inside.has(b)) edges.push([b, k]);
    const tally = new Map();
    for (const k of members) { const f = m.feature(m.byKey.get(k)); if (f) tally.set(f, (tally.get(f) || 0) + 1); }
    const feature = [...tally].sort((a, b) => b[1] - a[1])[0]?.[0];
    const open = members.filter((k) => m.byKey.get(k).state !== "done").length;
    groups.push({ pos, edges, width, height: layers.length * (NH + GY) - GY, feature, open, first: Math.min(...members.map((k) => m.byKey.get(k).n)) });
  }
  groups.sort((a, b) => b.open - a.open || a.first - b.first);

  let lit = null;   // the picked item with everything above and below it
  if (ui.sel && m.byKey.has(ui.sel) && link.has(ui.sel)) {
    lit = new Set([ui.sel]);
    const up = (k) => (m.byKey.get(k)?.blocked_by || []).forEach((b) => { if (m.byKey.has(b) && !lit.has(b)) { lit.add(b); up(b); } });
    const down = (k) => (m.dependents.get(k) || []).forEach((d) => { if (!lit.has(d)) { lit.add(d); down(d); } });
    up(ui.sel); down(ui.sel);
  }

  const trees = groups.map((g) => `<div class="tree">
    <h3>${esc(g.feature ? g.feature.title : "Linked work")}<span>${g.open} open</span></h3>
    <div class="canvas" style="width:${g.width}px;height:${g.height}px">
      <svg width="${g.width}" height="${g.height}" aria-hidden="true">${g.edges.map(([a, b]) => {
        const p = g.pos.get(a), q = g.pos.get(b), x1 = p.x + NW / 2, y1 = p.y + NH, x2 = q.x + NW / 2, y2 = q.y;
        return `<path class="${lit && !(lit.has(a) && lit.has(b)) ? "off" : ""}" d="M${x1},${y1} C${x1},${y1 + GY / 1.5} ${x2},${y2 - GY / 1.5} ${x2},${y2}"/>`;
      }).join("")}</svg>
      ${[...g.pos].map(([k, p]) => {
        const i = m.byKey.get(k), [word, cls] = stateOf(i), u = m.below(k).length;
        return `<button class="node ${cls}${ui.sel === k ? " sel" : ""}${lit && !lit.has(k) ? " fade" : ""}" data-act="sel" data-key="${esc(k)}" aria-pressed="${ui.sel === k}"
          style="left:${p.x}px;top:${p.y}px;width:${NW}px;height:${NH}px" title="${esc(i.title)}">
          <span class="t">${esc(i.title)}</span><span class="m"><span>#${i.n} ${esc(word)}</span>${u ? `<span>unblocks ${u}</span>` : ""}</span></button>`;
      }).join("")}
    </div></div>`).join("");

  let picked = "";
  if (lit) {
    const i = m.byKey.get(ui.sel), [word] = stateOf(i), waits = m.waitsOn(i), under = m.below(ui.sel).map((k) => m.byKey.get(k));
    picked = `<p class="picked"><b class="strong">#${i.n} ${esc(i.title)}</b> <span class="mute">${esc(i.repo)}</span>. ${esc(word)}${i.pick ? `, number ${i.pick} to be built` : ""}.
      ${i.note ? esc(i.note) + "." : ""}
      ${waits.length ? `Waits on ${waits.map((w) => `#${w.n} ${esc(w.title)}`).join(" and ")}.` : ""}
      ${under.length ? `Holds up ${under.map((w) => `#${w.n}`).join(", ")}.` : "Holds nothing up."}
      ${i.pr ? prLink(i.repo, i.pr, "PR history") : ""}</p>`;
  }
  const loose = m.shown.filter((i) => !link.has(key(i)) && i.state !== "done").sort(m.order);
  return (trees ? `<div class="pyramid">${trees}</div>` : `<p class="empty">Nothing here waits on anything else.</p>`) + picked
    + (loose.length ? `<p class="loose">On their own, blocking nothing: ${loose.map((i) => `<b>#${i.n} ${esc(i.title)}</b> (${esc(stateOf(i)[0].toLowerCase())})`).join(", ")}.</p>` : `<p class="loose"></p>`);
}

// ------------------------------------------------------------------ status, usage and repositories
// Every window says what's left of it and when it resets, as T3 Code says it ("70% left"; ticket
// 51, #60: what's left, not what's used; the snapshot keeps `used`). The bar drains as it's used,
// amber at 15% left and red at none; the blue at its left end is the share kept for you, the last
// of what's left. The Usage page adds what the runner makes of it.
function meter(w, full) {
  const known = typeof w.used === "number", left = known ? Math.max(0, Math.min(100, Math.round(100 - w.used))) : null;
  const cls = known && left <= 0 ? " full" : known && left <= 15 ? " near" : "";
  // The kept share is the last of what's left, so it's never wider than what's left (PR #62 F1).
  const kept = known && w.reserve > 0 ? Math.min(w.reserve, left) : 0;
  return `<div class="meter${cls}" title="${esc(w.note || "")}"><span class="label">${esc(w.label)}</span>
    <span class="bar" role="img" aria-label="${esc(w.label)}: ${known ? left + "% left" : "unknown"}">
      ${known ? `<i class="fill" style="width:${left}%"></i>` : ""}${kept > 0 ? `<i class="kept" style="width:${kept}%" title="${kept}% of what's left is kept for you"></i>` : ""}</span>
    <span class="pct">${known ? left + "% left" : "?"}</span>
    <span class="when"${w.resets_at ? ` title="${esc(stamp(w.resets_at))}"` : ""}>${w.resets_at ? `Resets ${esc(clock(w.resets_at))}` : "Not started"}${full && !w.gates ? `. ${esc(w.note || "Not used by the runner.")}` : ""}</span></div>`;
}
// A plan's reset credits (ticket 42): said only while it has some. Redeeming one is T3's.
const resetsLeft = (p) => (p.resets && p.resets.available > 0 ? plural(p.resets.available, "reset", "resets") + " left, " : "");
const plan = (p, full) => (full ? planFull(p) : planCard(p));
const planFull = (p) => `<div class="plan">
    <p class="plan-name">${who(p.provider, p.name)}<span class="read">${p.plan ? esc(p.plan) + ", " : ""}${resetsLeft(p)}${p.read_at ? `<span title="${esc(stamp(p.read_at))}, ${esc(ago(p.read_at))} ago">read ${esc(hm(p.read_at))}</span>` : "not read yet"}</span></p>
    ${p.error ? `<p class="plan-note bad">${esc(p.error)}</p>` : ""}
    ${(p.windows || []).map((w) => meter(w, true)).join("")}
    ${(p.windows || []).filter((w) => w.reserve).map((w) => `<p class="plan-note">${w.reserve}% of the week is kept for you.</p>`).join("")}
  </div>`;
// PROTOTYPE (take 12, Stefan 2026-11-17): the card as the first prototype (localhost:5288) drew it:
// a row per window, its name, a thin bar and the bold figure, with when it resets small under the
// name. A model's own week (Fable's) is a line under Weekly, not a window of its own; it says its
// reset only when that isn't Weekly's.
function meterRow(w, sub, week) {
  const known = typeof w.used === "number", left = known ? Math.max(0, Math.min(100, Math.round(100 - w.used))) : null;
  const cls = known && left <= 0 ? " full" : known && left <= 15 ? " near" : "";
  const kept = known && w.reserve > 0 ? Math.min(w.reserve, left) : 0;
  const same = sub && week && w.resets_at && week.resets_at && Math.abs(ms(w.resets_at) - ms(week.resets_at)) < 90e3;
  const label = sub ? w.label.replace(/^Weekly,?\s*/, "") : w.label;
  const when = !w.resets_at ? (sub ? "" : "not started") : same ? "" : `resets ${clock(w.resets_at)}`;
  return `<div class="mrow2${sub ? " sub" : ""}${cls}" title="${esc([w.note, w.resets_at ? `Resets ${stamp(w.resets_at)}` : ""].filter(Boolean).join(". "))}">
    <span class="m-label">${esc(label)}${when ? `<span class="m-when">${esc(when)}</span>` : ""}</span>
    <span class="m-bar" role="img" aria-label="${esc(w.label)}: ${known ? left + "% left" : "unknown"}">${known ? `<i class="fill" style="width:${left}%"></i>` : ""}${kept > 0 ? `<i class="kept" style="width:${kept}%"></i>` : ""}</span>
    <span class="m-pct">${known ? left + "%" : "?"}</span></div>`;
}
function planCard(p) {
  const ws = p.windows || [], week = ws.find((w) => w.id === "week");
  const rows = ws.map((w) => meterRow(w, w.id.startsWith("week_"), week)).join("");
  const kept = ws.find((w) => w.reserve);
  return `<div class="plan2">
    <p class="plan2-name">${who(p.provider, p.name)}<span class="read">${p.plan ? esc(p.plan) + " · " : ""}${p.resets && p.resets.available > 0 ? `${plural(p.resets.available, "reset", "resets")} · ` : ""}${p.read_at ? `<span title="${esc(stamp(p.read_at))}">read ${esc(hm(p.read_at))}</span>` : "not read yet"}</span></p>
    ${p.error ? `<p class="plan-note bad">${esc(p.error)}</p>` : ""}${rows}
    ${kept ? `<p class="plan2-note">Your ${kept.reserve}% of the week${kept.reserve_opens_at ? ` opens to the runner ${esc(clock(kept.reserve_opens_at))}` : " is kept for you"}.</p>` : ""}</div>`;
}

// Is it up, and is everything it leans on up. One line while all is well.
// Sources are grouped the way Stefan sorts them: the providers, what runs on this PC, what's outside.
const SOURCE_GROUPS = [["provider", "Providers"], ["local", "Local"], ["external", "External"]];
function status() {
  const down = frozen(), all = snap.sources || [], bad = all.filter((x) => !x.ok);
  const known = SOURCE_GROUPS.map((g) => g[0]);
  const groups = [...SOURCE_GROUPS, ["", "Other"]].map(([id, label]) => [label, all.filter((x) => (known.includes(x.group) ? x.group : "") === id)]).filter((g) => g[1].length);

// Each repository's Stop or Resume (ticket 37), in the order the runner takes them up. The page
// can't reorder them any more (#61, Stefan 2026-11-16: "just stop and resume").
function repoRows() {
  const stale = frozen();
  const rows = (snap.repos || []).map((r) => {
    const name = r.name, a = (ctl.repos || {})[name], pending = a && !wasRead(a.at) && !!a.stop !== !!r.stopped;
    const off = pending ? !!a.stop : !!r.stopped;
    // What it's doing now (#50: each runs its own Claude job): the job, else why none starts.
    const now = r.doing ? `${kind(r.doing.kind)[0]} ${r.doing.ref}, ${ago(r.doing.started_at)} in`
      : r.wait ? `Waiting: ${r.wait.reason.replace(/\.$/, "")}` : "Idle";
    const sub = pending ? (a.stop ? "Asked to stop: the runner hasn't read it yet" : "Asked to resume: the runner hasn't read it yet")
      : r.stopped ? `Stopped${r.stopped.at ? ` since ${clock(r.stopped.at)}` : ""}${r.doing ? `; ${now.replace(/^./, (c) => c.toLowerCase())}` : ""}`
      : `${now}. ${r.merge === "stefan" ? "You merge" : "The runner merges"}.`;
    const btn = stale ? "" : off
      ? `<button class="btn sm icon solid" data-act="repostop" data-repo="${esc(name)}" data-how="" aria-label="Resume ${esc(name)}" title="Resume: both lanes take up its work again">${ICON.play}</button>`
      : `<button class="btn sm icon" data-act="repostop" data-repo="${esc(name)}" data-how="after-job" aria-label="Stop ${esc(name)}" title="Stop: a job running on it finishes; then neither lane takes up its work">${ICON.pause}</button>`;
    return `<li${r.stopped ? ' class="off"' : ""}><span class="name">${esc(name)}<span>${esc(sub)}</span></span>${btn}</li>`;
  }).join("");
  return `<ul class="order">${rows}</ul>`;
}

// Refresh (ticket 42): asks the runner to read both plans now (control.json's usage.refresh_at).
// It spins until the snapshot says the runner acted on that request (usage_refresh), which is
// its next write, 30 seconds at most. Claude's endpoint is asked at most once every 5 minutes
// (issue 66), so inside that the runner gives back its last reading, and the note says when it
// was read and when the next read can be. A plan's error is the snapshot's to say (Claude's only
// once its reading is past 30 minutes, or its login is the trouble); no time here decides one.
// Off while the runner is silent.
const refreshAsked = () => (ctl.usage && ctl.usage.refresh_at) || null;
const canRefresh = () => !frozen() && "usage_refresh" in snap;   // a runner older than ticket 42 can't
const refreshPending = () => !!refreshAsked() && canRefresh() && !(snap.usage_refresh && ms(snap.usage_refresh.asked_at) >= ms(refreshAsked()));
function refreshNotes() {
  const at = refreshAsked();
  if (!at || refreshPending() || !snap.usage_refresh) return [];
  return (snap.usage || []).flatMap((p) => p.error ? [{ bad: true, text: `The refresh couldn't read ${p.name}: ${p.error}` }]
    : p.read_at && p.next_read_at && ms(p.read_at) < ms(at) ? [{ bad: false, text: `${p.name}: read ${ago(p.read_at)} ago. Next read from ${hm(p.next_read_at)}.` }]
    : []);
}
function refreshButton() {
  const busy = refreshPending(), off = !canRefresh();
  const title = frozen() ? "The runner is silent: it can't read usage now" : off ? "The runner's code is older than Refresh" : busy ? "Reading both plans now" : "Refresh";
  return `<button class="btn sm icon refresh${busy ? " spin" : ""}" data-act="refresh" title="${title}" aria-label="${busy ? "Refreshing usage" : "Refresh usage"}" ${off || busy ? "disabled" : ""}>${ICON.refresh}</button>`;
}
let refreshPoll = 0;   // while a refresh is on its way, the snapshot is read every 2 seconds
function rail() {
  clearTimeout(refreshPoll);
  if (refreshPending()) refreshPoll = setTimeout(load, 2000);
  const notes = refreshNotes().map((n) => `<p class="plan-note${n.bad ? " bad" : ""}" style="margin:0 0 14px">${esc(n.text)}</p>`).join("");
  const usage = `<section class="card usage2"><header class="card-head"><span class="u-icon">${ICON.usage}</span><h2>Usage</h2><a class="details" href="${esc(href({ page: "usage", pr: null }))}" data-act="page" data-page="usage">Details</a>${refreshButton()}</header>
    <div class="card-pad">${notes}${(snap.usage || []).map((p) => plan(p, false)).join("")}</div></section>`;
  const repos = `<section class="card"><header class="card-head"><h2>Repositories</h2></header><div class="card-pad" style="padding-top:8px">${repoRows()}</div></section>`;
  return (ui.page === "usage" ? "" : usage) + repos + status();
}

// ------------------------------------------------------------------ the other pages

      <span class="what"><b>${esc(e.title)}</b>${e.detail ? `<span>${esc(e.detail)}</span>` : ""}</span>
      <span class="where">${e.repo ? repoTag(e.repo) : ""}${e.pr ? prLink(e.repo, e.pr, esc(e.ref || `PR #${e.pr}`)) : esc(e.ref || "")}</span></li>`;
  }
  return `<section class="card" aria-label="What happened, newest first"><ol>${out}</ol></section>`;
}

function settings() {

  return `<section class="card"><header class="card-head"><h2>Your share of each plan</h2></header>
      <table class="plain"><tbody>
        <tr><td style="width:190px">${who("claude", "Claude")}</td><td>${knob.reserve ?? "?"}% of the week is kept for you until 24 hours before it resets.</td><td class="num mute small"><code>--reserve N</code> changes it</td></tr>
        <tr><td>${who("chatgpt", "ChatGPT")}</td><td class="mute">Nothing is kept back yet.</td><td class="num"><span class="later">Not built yet</span></td></tr>
      </tbody></table></section>
    ${roles.length ? `<section class="card"><header class="card-head"><h2>Who does what</h2><span class="later" style="margin-left:auto">Fixed for now</span></header>
      <table class="plain"><tbody>${roles.map((x) => { const l = lanesBy.get(x.lane) || {}; return `<tr><td class="strong" style="width:150px">${esc(x.job)}</td><td class="mute">${esc(x.what)}</td><td style="width:170px">${who(l.provider, l.name || x.lane)}</td></tr>`; }).join("")}</tbody></table></section>` : ""}
    <section class="card"><header class="card-head"><h2>Connections</h2></header>
      <ul class="rows">
        <li><i class="dot ${stale ? "bad" : "ok"}"></i><span class="strong">Runner</span><span class="${stale ? "no" : "mute"}">${stale ? `Silent since ${esc(clock(snap.written_at))}` : `Up${r.started_at ? ` since ${esc(clock(r.started_at))}` : ""}, process ${esc(r.pid ?? "unknown")}, on commit <span class="sha">${esc(r.commit)}</span>`}</span><span class="dim small">wrote ${esc(clock(snap.written_at))}</span></li>
        ${(snap.sources || []).map((s) => `<li><i class="dot ${stale ? "" : s.ok ? "ok" : "bad"}"></i><span class="strong">${esc(s.name)}</span><span class="${s.ok ? "mute" : "no"}">${esc(s.note || (s.ok ? "ok" : "failing"))}${!s.ok && s.affects ? `. ${esc(s.affects)}` : ""}</span><span class="dim small">${s.checked_at ? `${s.ok ? "checked" : "last good"} ${esc(clock(s.checked_at))}` : s.ok ? "" : "never answered"}</span></li>`).join("")}
      </ul></section>`;
}

// ------------------------------------------------------------------ a PR's history
function sheet() {
  if (!ui.pr || !snap) return "";
  const pr = (snap.prs || []).find((p) => p.repo === ui.pr.repo && p.n === ui.pr.n);
  if (!pr) return `<div class="sheet-head"><div class="row"><span class="mute">${esc(ui.pr.repo)} PR #${ui.pr.n}</span><button class="btn sm" data-act="closepr">Close</button></div>
    <p class="status">The snapshot has no history for this PR.</p></div>`;
  const groups = [];
  for (const e of pr.timeline || []) {
    const last = groups[groups.length - 1];
    if (last && last.sha === e.sha) last.events.push(e); else groups.push({ sha: e.sha, events: [e] });
  }
  const heads = [...new Set(groups.map((g) => g.sha))];
  const day = (iso) => { const d = new Date(iso); return d.toDateString() === new Date().toDateString() ? hm(iso) : `${d.toLocaleDateString("en-GB", { weekday: "short" })} ${hm(iso)}`; };
  return `<div class="sheet-head">
      <div class="row"><span class="tag">${esc(pr.repo)}</span><span class="mute">PR #${pr.n}, closes #${pr.issue}</span><button class="btn sm" data-act="closepr">Close</button></div>
      <h2>${esc(pr.title)}</h2>
      <p class="status"><b>${esc(pr.status)}.</b> ${esc(pr.next)}</p>
      ${(pr.checks || []).length ? `<ul class="checks">${pr.checks.map((c) => `<li class="${c.ok ? "" : "no"}"><i class="dot ${c.ok ? "ok" : ""}"></i>${esc(c.label)}${c.ok ? "" : ": not yet"}</li>`).join("")}</ul>` : ""}
      <p class="status small"><span class="mute">Head</span> <span class="sha">${esc(pr.head)}</span> <span class="mute">on</span> <span class="sha">${esc(pr.branch)}</span>
        <a class="link" style="margin-left:10px" href="${esc(pr.url)}" target="_blank" rel="noreferrer">Open on GitHub</a></p>
    </div>
    <ol class="heads">${groups.map((g) => `<li class="head-group">
      <p>Head ${heads.indexOf(g.sha) + 1}${g.sha === pr.head ? ", the current one" : ""} <span class="sha">${esc(g.sha)}</span></p>
      <ol class="events">${g.events.map((e) => `<li class="event ${esc(e.tone || "")}">
        <span class="at">${esc(day(e.at))}</span>
        <div class="ti"><span class="actor">${esc((ACTOR[e.actor] || [e.actor])[0])}</span><b>${esc(e.title)}</b>
          ${e.detail ? `<p class="mute small">${esc(e.detail)}</p>` : ""}
          ${(e.findings || []).length ? `<div class="findings">${e.findings.map((f) => `<span class="id">${esc(f.id)}</span><span class="tx">${esc(f.text)}</span><span class="st ${esc(f.status)}">${esc(f.status)}</span>`).join("")}</div>` : ""}
        </div></li>`).join("")}</ol></li>`).join("")}</ol>`;
}

// ------------------------------------------------------------------ drawing
function put(id, html) {
  if (drawn[id] === html) return;
  const host = $(id), keep = {};
  host.querySelectorAll("[data-scroll]").forEach((el) => { keep[el.dataset.scroll] = el.scrollTop; });
  drawn[id] = html;
  host.innerHTML = html;
  host.querySelectorAll("[data-scroll]").forEach((el) => { if (keep[el.dataset.scroll]) el.scrollTop = keep[el.dataset.scroll]; });
}

function beat() {
  const b = $("beat");
  if (!b || !snap) return;
  const stale = isStale(), gone = fault === "server";
  const text = gone ? "This page lost its server" : stale ? `Runner silent for ${ago(snap.written_at)}` : `Updated ${ago(snap.written_at)} ago`;
  b.innerHTML = `<i class="dot ${gone || stale ? "bad" : "ok"}"></i>${esc(text)}`;
}

function draw() {
  if (dragging) return;   // a row is held (the Queue, take 11): redrawing would drop it
  document.body.classList.toggle("page-wide", ui.page === "queue" && ui.qview === "board");
  document.body.classList.toggle("nav-open", ui.nav);
  document.body.classList.toggle("rail-open", ui.rail);
  document.body.classList.toggle("page-inbox", ui.page === "inbox");
  if (snap && ui.repo && !(snap.repos || []).some((r) => r.name === ui.repo)) ui.repo = "";
  put("side", side());
  put("top", topBar());
  if (!snap) {
    const why = fault === "missing" ? ["The runner hasn't written a snapshot yet", esc(faultStart || "Start the runner, and this page fills in by itself.")]
      : fault === "unreadable" ? ["The snapshot can't be read", "The file is there but isn't valid. The runner's log says what went wrong."]
      : ["This page can't reach its server", "Start it with <code>python3 -m dashboard</code> in the queue-runner folder."];
    put("main", fault ? `<div class="blank"><h2>${why[0]}</h2><p class="mute">${why[1]}</p></div>` : "");
    put("rail", ""); put("sheet", "");
    return;
  }
  const page = { inbox, queue, activity, usage: usagePage, settings }[ui.page] || overview;
  put("main", notices() + page());
  placeRowMenu();
  put("rail", rail());
  const s = sheet(), dlg = $("sheet");
  put("sheet", s);
  if (s && !dlg.open) dlg.showModal();
  if (!s && dlg.open) dlg.close();
  const n = (snap.asks || []).filter((a) => !snoozedUntil(a)).length;
  document.title = `${n ? `(${n}) ` : ""}Queue runner`;
  beat();
}

// ------------------------------------------------------------------ reading and asking
async function load() {
  try {
    const [s, c] = await Promise.all([
      fetch("/snapshot.json" + (sampleName ? `?sample=${encodeURIComponent(sampleName)}` : ""), { cache: "no-store" }),
      fetch("/control.json", { cache: "no-store" }),
    ]);
    ctl = c.ok ? await c.json() : {};
    if (s.ok) { snap = await s.json(); fault = null; }
    else { fault = s.status === 404 ? "missing" : "unreadable"; faultStart = fault === "missing" ? ((await s.json().catch(() => ({}))).start || "") : ""; snap = null; }
  } catch { fault = "server"; }
  draw();
}

async function send(bodies) {
  try {
    for (const body of bodies) {
      const r = await fetch("/control", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      if (!r.ok) { alert(`That wasn't written: ${(await r.json()).error}`); break; }
    }
  } catch { fault = "server"; }
  await load();
  setTimeout(load, 1500); setTimeout(load, 4500);   // the runner reads it within a few seconds
}

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  const act = el ? el.dataset.act : null;
  let changed = false;
  if (ui.pop && !e.target.closest(".pop") && act !== "pop") { ui.pop = null; changed = true; }
  if (ui.rail && !e.target.closest(".rail") && act !== "rail") { ui.rail = false; changed = true; }
  if (!el) {
    if (e.target === $("sheet")) { ui.pr = null; address(); changed = true; }   // a click beside the sheet closes it
    else if (ui.pop && e.target.closest(".pop a")) { ui.pop = null; changed = true; }
    if (changed) draw();
    return;
  }
  const d = el.dataset;
  switch (act) {
    case "pop": ui.pop = ui.pop === d.pop ? null : d.pop; break;
    case "nav": ui.nav = !ui.nav; break;
    case "navclose": ui.nav = false; break;
    case "rail": ui.rail = !ui.rail; break;
    case "page":
      if (e.ctrlKey || e.metaKey || e.shiftKey) return;   // a new tab is the browser's to open
      e.preventDefault();
      ui.page = d.page; ui.nav = false; ui.pop = null; ui.rail = false;
      if (d.ask) { ui.ask = d.ask; ui.hold = null; }   // a link that opens the Inbox at one ask
      address(true); draw(); scrollTo(0, 0);
      return;
    case "repo": ui.repo = d.repo; remember("repo", d.repo); ui.pop = null; ui.sel = null; break;
    case "ask": ui.ask = d.id; ui.hold = null; break;
    case "unread": {
      const a = inboxOrder().find((x) => x.id === d.id);
      if (!a) return;
      toggleRead(a);
      break;
    }
    case "snooze": setSnooze(d.id, d.until); ui.pop = null; if (ui.ask === d.id) ui.ask = null; break;
    case "wake": setSnooze(d.id, null); break;
    case "fold": remember(d.id, recall(d.id) === "folded" ? "open" : "folded"); break;
    case "view": ui.view = d.view; remember("view", d.view); break;
    case "feature": ui.feature = ui.feature === d.id ? "" : d.id; ui.sel = null; scrollTo(0, 0); break;   // the Queue, A
    case "open": ui.open = ui.open.includes(d.id) ? ui.open.filter((x) => x !== d.id) : [...ui.open, d.id]; break;   // the Queue, B
    case "variant": turnVariant(Number(d.by)); break;   // PROTOTYPE
    case "q-open": toggleOpen(d.id); break;   // PROTOTYPE (#30, take 12)
    case "q-view": ui.qview = d.view; remember("qview", d.view); break;
    case "q-more": if (qMore.has(d.col)) qMore.delete(d.col); else qMore.add(d.col); break;
    case "q-undo": { const was = JSON.parse(undo.pop() || "null"); if (was) { ord.kids = was.kids; ord.touched = new Set(was.touched); } lastMove = null; break; }
    case "q-reset": undo.push(JSON.stringify({ kids: ord.kids, touched: [...ord.touched] })); ord.kids = {}; ord.touched = new Set(); lastMove = null; break;
    case "stop": ui.pop = null; send([{ lane: d.lane, stop: d.how || null }]); return;
    case "repostop": send([{ repo: d.repo, stop: d.how || null }]); return;   // one repository (ticket 37)
    case "decide": send([{ ask: d.id, open: true }]); return;   // a T3 thread for this ask (ticket 35)
    case "fresh": send([{ ask: d.id, fresh: true }]); return;   // a fresh one for a stale thread (#72)
    case "refresh":   // read both plans now (ticket 42); spins at once, until the runner has
      ctl = { ...ctl, usage: { refresh_at: new Date().toISOString() } };
      draw(); send([{ usage: "refresh" }]); return;
    case "all": {
      const how = d.how || null;
      ui.pop = null;
      send((snap.lanes || []).map((l) => ({ lane: l.id, stop: how === "now" && l.state === "working" && !(l.stop_now || {}).available ? "after-job" : how })));
      return;
    }
    case "pr": ui.pr = { repo: d.repo, n: Number(d.n) }; break;
    case "closepr": ui.pr = null; break;
    case "sel": ui.sel = ui.sel === d.key ? null : d.key; break;
  }
  address();
  draw();
});
// In the Inbox the arrow keys walk the list, as in a mail client; `u` marks the row that has
// focus unread (or read) and `s` opens its Snooze menu, as its icons do: the focused row, not the
// open ask (PR #59's review 1, F1), which they fall back to when focus is on no row.
const rowOf = (id) => [...document.querySelectorAll(".mrow")].find((r) => r.dataset.id === id);
const focusRow = (id = ui.ask) => { const row = rowOf(id); if (row) row.focus(); };
const focusedAsk = (el) => {
  const li = el && el.closest ? el.closest("li") : null, row = li && li.querySelector(".mrow");
  return row ? row.dataset.id : ui.ask;
};
document.addEventListener("keydown", (e) => {
  if (ui.page !== "inbox" || !snap || ui.pop || ui.pr || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.target.closest("input, textarea, select")) return;
  if (e.key === "u" || e.key === "s") {
    const id = focusedAsk(e.target), a = inboxOrder().find((x) => x.id === id);
    if (!a || a.answered || snoozedUntil(a)) return;
    e.preventDefault();
    if (e.key === "u") { toggleRead(a); draw(); focusRow(a.id); return; }
    ui.pop = `snooze:${a.id}`; draw();
    const first = document.querySelector(".row-pop .mi");
    if (first) first.focus();
    return;
  }
  const step = e.key === "ArrowDown" ? 1 : e.key === "ArrowUp" ? -1 : 0;
  if (!step) return;
  const every = inboxOrder();
  const to = every[every.findIndex((a) => a.id === ui.ask) + step];
  if (!to) return;
  e.preventDefault();
  ui.ask = to.id; ui.hold = null;
  address(); draw();
  const row = document.querySelector('.mrow[aria-current="true"]');
  if (row) { row.focus(); row.scrollIntoView({ block: "nearest" }); }
});
// PROTOTYPE (#30, take 12): the board's and the graph's effort dropdown.
document.addEventListener("change", (e) => {
  if (e.target.dataset && e.target.dataset.change === "q-effort") { ui.qeffort = e.target.value; draw(); }
});
// PROTOTYPE: on the Queue the left and right arrow keys turn to the next arrangement.
document.addEventListener("keydown", (e) => {
  if (ui.page !== "queue" || !snap || !snap.sample || ui.pr || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.target.closest?.("input, textarea, select, [contenteditable]")) return;
  const turn = e.key === "ArrowRight" ? 1 : e.key === "ArrowLeft" ? -1 : 0;
  if (!turn) return;
  e.preventDefault();
  turnVariant(turn); address(); draw(); scrollTo(0, 0);
});
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape" || !(ui.pop || ui.rail || ui.nav)) return;
  const pop = String(ui.pop), from = pop.startsWith("snooze:") ? pop.slice("snooze:".length) : null;
  ui.pop = null; ui.rail = false; ui.nav = false;
  draw();
  if (from) focusRow(from);   // back to the row the menu opened from, not the open ask
});
// The row's Snooze menu follows its row as the list or the window scrolls.
document.addEventListener("scroll", () => { if (String(ui.pop).startsWith("snooze:")) placeRowMenu(); }, true);
addEventListener("resize", placeRowMenu);
$("sheet").addEventListener("close", () => { if (ui.pr) { ui.pr = null; address(); draw(); } });
addEventListener("popstate", () => { readAddress(); draw(); });

// Fresh whenever you look: on focus, and every ten seconds while the tab is in front.
addEventListener("focus", load);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") load(); });
setInterval(() => { if (document.visibilityState === "visible") load(); }, POLL_MS);
let wasStale = false;
setInterval(() => {
  if (!snap) return;
  if (isStale() !== wasStale) { wasStale = isStale(); draw(); } else beat();   // the moment the runner goes quiet, say so
}, 1000);
load();
</script>
</body>
</html>
